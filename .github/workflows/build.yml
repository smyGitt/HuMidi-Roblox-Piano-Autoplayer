name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - v2.1.1

permissions:
  contents: write

jobs:
  delete-previous-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous prerelease for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "build-${{ github.ref_name }}" --yes --cleanup-tag --repo "${{ github.repository }}" || true

  build:
    needs: delete-previous-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach to prerelease
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: build-${{ github.ref_name }}
          releaseName: 'Build (${{ github.ref_name }})'
          releaseBody: 'testing out a new GUI, feel free to test it please!!!!!!'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
