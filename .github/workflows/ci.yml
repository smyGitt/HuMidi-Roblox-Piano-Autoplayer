name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Give the tests access to a virtual keyboard
        run: |
          sudo modprobe uinput
          sudo chmod 0666 /dev/uinput
          echo 'KERNEL=="event*", ATTRS{name}=="HuMidi virtual keyboard", MODE="0666"' | sudo tee /etc/udev/rules.d/99-humidi-virtual-keyboard.rules
          sudo udevadm control --reload-rules

      - name: Virtual keyboard tests
        working-directory: src-tauri
        run: cargo test --lib -- --ignored uinput
