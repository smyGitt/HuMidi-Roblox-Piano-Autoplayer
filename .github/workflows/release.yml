name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.4) — the tag must already exist in the repo. Leave blank for a dry-run build test."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build only — skip creating the GitHub Release"
        required: false
        type: boolean
        default: false

jobs:
  check-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract APP_VERSION from main.py
        id: app_version
        run: |
          VERSION=$(python3 -c "
          import re, sys
          content = open('main.py').read()
          m = re.search(r'^APP_VERSION\s*=\s*[\"\']([\d.]+)[\"\']\s*$', content, re.MULTILINE)
          if not m:
              print('ERROR: APP_VERSION not found in main.py', file=sys.stderr)
              sys.exit(1)
          print(m.group(1))
          ")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        run: |
          TAG_VERSION="${{ steps.tag.outputs.name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          APP_VERSION="${{ steps.app_version.outputs.value }}"
          echo "Tag version : $TAG_VERSION"
          echo "APP_VERSION : $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Version mismatch — tag is 'v$TAG_VERSION' but APP_VERSION in main.py is '$APP_VERSION'. Update APP_VERSION before tagging."
            exit 1
          fi
          echo "Versions match: $APP_VERSION ✓"

      - name: Check new version is greater than latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.name }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request, urllib.error

          new_version = os.environ["NEW_TAG"].lstrip("v")
          token = os.environ["GH_TOKEN"]

          req = urllib.request.Request(
              "https://api.github.com/repos/smyGitt/HuMidi-Roblox-Piano-Autoplayer/releases/latest",
              headers={
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "HuMidi-ci",
                  "Accept": "application/vnd.github+json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read())
              latest_tag = data.get("tag_name", "").lstrip("v")
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print("No previous release found — skipping version order check.")
                  sys.exit(0)
              raise

          def parse(v):
              return tuple(int(x) for x in v.split("."))

          new_t    = parse(new_version)
          latest_t = parse(latest_tag)

          print(f"Latest release : v{latest_tag}")
          print(f"New tag        : v{new_version}")

          if new_t <= latest_t:
              print(f"::error::v{new_version} is not greater than the latest release v{latest_tag}. Bump APP_VERSION and use a higher tag.")
              sys.exit(1)

          print("Version order OK ✓")
          EOF
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: check-version
    if: ${{ always() && needs.check-version.result != 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build HuMidi
        run: pyinstaller HuMidi.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/HuMidi.exe
          if-no-files-found: error
          
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: check-version
    if: ${{ always() && needs.check-version.result != 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build .app bundle
        run: pyinstaller HuMidi.spec

      - name: Create DMG from .app bundle
        working-directory: dist
        run: >
          hdiutil create
          -volname "HuMidi"
          -srcfolder "HuMidi.app"
          -ov
          -format UDZO
          HuMidi.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/HuMidi.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    needs: check-version
    if: ${{ always() && needs.check-version.result != 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxtst6 libxcb-cursor0 xvfb

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build HuMidi
        run: pyinstaller HuMidi.spec

      - name: Smoke test built binary
        run: |
          xvfb-run --auto-servernum dist/HuMidi/HuMidi &
          APP_PID=$!
          sleep 5
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "::error::HuMidi exited within 5s of launch under Xvfb — build is likely broken at runtime."
            exit 1
          fi
          kill $APP_PID

      - name: Package as HuMidi.tar.gz
        working-directory: dist
        run: tar -czf HuMidi.tar.gz HuMidi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: dist/HuMidi.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    permissions:
      contents: write

    steps:
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "HuMidi ${{ steps.tag.outputs.name }}"
          draft: false
          prerelease: false
          files: |
            artifacts/windows-exe/HuMidi.exe
            artifacts/macos-dmg/HuMidi.dmg
            artifacts/linux-tar/HuMidi.tar.gz
